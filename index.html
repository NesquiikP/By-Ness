
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JADIX | Sistema</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050509;
    color: white;
    font-family: Consolas, monospace;
    min-height: 100vh;
    overflow: hidden;
}

#matrix {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: .45;
}

.glow {
    position: fixed;
    width: 500px;
    height: 500px;
    background: #7300ff;
    filter: blur(180px);
    opacity: .2;
    z-index: 0;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.screen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
    padding: 20px;
}

.panel {
    width: 100%;
    max-width: 470px;
    padding: 40px 28px;
    background: rgba(10, 10, 20, .94);
    border: 1px solid #873cff;
    border-radius: 16px;
    box-shadow: 0 0 30px #702cff55;
    text-align: center;
}

.logo {
    font-size: 30px;
    color: #b78aff;
    letter-spacing: 12px;
    text-shadow: 0 0 20px #8b35ff;
    margin-bottom: 30px;
}

.terminal {
    text-align: left;
    background: #080810;
    border: 1px solid #30234b;
    padding: 18px;
    border-radius: 8px;
    min-height: 125px;
    margin-bottom: 25px;
    color: #39ff9c;
    font-size: 12px;
    line-height: 2;
}

.terminal p {
    min-height: 20px;
}

.barra {
    width: 100%;
    height: 8px;
    background: #242035;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progresso {
    height: 100%;
    width: 0%;
    background: #9b4dff;
    box-shadow: 0 0 15px #9b4dff;
    transition: width .2s;
}

h1 {
    font-size: clamp(25px, 7vw, 35px);
    color: white;
    text-shadow: 0 0 15px #9b4dff;
    margin-bottom: 15px;
}

.descricao {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 30px;
}

button {
    width: 100%;
    padding: 16px;
    border: 1px solid #a879ff;
    border-radius: 8px;
    background: linear-gradient(90deg, #6722ce, #4132bd);
    color: white;
    font-family: Consolas, monospace;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    transform: scale(1.04);
    box-shadow: 0 0 25px #8b35ff;
}

#entrada {
    display: flex;
}

#principal {
    display: none;
}

.status {
    color: #36ff9c;
    font-size: 11px;
    letter-spacing: 3px;
    margin-bottom: 25px;
}

.discord {
    background: #151326;
    border: 1px solid #8050ff;
    padding: 20px;
    border-radius: 10px;
    margin: 25px 0;
}

.rotulo {
    color: #999;
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.usuario {
    font-size: 23px;
    color: #c6a3ff;
    text-shadow: 0 0 12px #8b35ff;
}

.linha {
    height: 1px;
    background: linear-gradient(90deg, transparent, #8b35ff, transparent);
    margin: 25px 0;
}

.rodape {
    color: #777;
    font-size: 10px;
    letter-spacing: 3px;
    line-height: 2;
}

@media(max-width: 400px) {
    .panel {
        padding: 30px 20px;
    }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div class="glow"></div>

<!-- TELA DE ENTRADA -->

<div class="screen" id="entrada">
    <div class="panel">

        <div class="logo">JADIX</div>

        <div class="terminal">
            <p id="linha1">> INICIALIZANDO SISTEMA...</p>
            <p id="linha2"></p>
            <p id="linha3"></p>
            <p id="linha4"></p>
        </div>

        <div class="barra">
            <div class="progresso" id="progresso"></div>
        </div>

        <h1>BEM-VINDO AO JADIX</h1>

        <p class="descricao">
            Sistema pronto. Aguarde sua entrada.
        </p>

        <button id="entrar" disabled onclick="entrarSistema()">
            CARREGANDO...
        </button>

    </div>
</div>

<!-- PÁGINA PRINCIPAL -->

<div class="screen" id="principal">
    <div class="panel">

        <div class="logo">JADIX</div>

        <div class="status">
            ● SISTEMA ONLINE
        </div>

        <h1>CHAME NO DISCORD</h1>

        <p class="descricao">
            Bem-vindo ao meu espaço digital.
            Vamos conversar?
        </p>

        <div class="discord">
            <div class="rotulo">MEU USUÁRIO</div>
            <div class="usuario">Nesquiik1999</div>
        </div>

        <button onclick="copiarDiscord()">
            COPIAR USUÁRIO
        </button>

        <div class="linha"></div>

        <div class="rodape">
            SISTEMAS JADIX © 2026
            <br>
            OBRIGADO PELA VISITA
        </div>

    </div>
</div>

<script>

// CHUVA DIGITAL

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let largura, altura, colunas, gotas;

function ajustarTela() {
    largura = canvas.width = window.innerWidth;
    altura = canvas.height = window.innerHeight;

    colunas = Math.floor(largura / 17);
    gotas = Array(colunas).fill(1);
}

function chuvaDigital() {
    ctx.fillStyle = "rgba(5, 5, 9, 0.09)";
    ctx.fillRect(0, 0, largura, altura);

    ctx.fillStyle = "#9b4dff";
    ctx.font = "15px Consolas";

    const caracteres = "01アイウエオカキクケコ";

    for (let i = 0; i < gotas.length; i++) {
        const letra = caracteres[
            Math.floor(Math.random() * caracteres.length)
        ];

        ctx.fillText(letra, i * 17, gotas[i] * 17);

        if (gotas[i] * 17 > altura && Math.random() > 0.975) {
            gotas[i] = 0;
        }

        gotas[i]++;
    }
}

ajustarTela();
window.addEventListener("resize", ajustarTela);
setInterval(chuvaDigital, 45);


// CARREGAMENTO DA TELA

let porcentagem = 0;

const mensagens = [
    "> CONECTANDO AO SERVIDOR...",
    "> CARREGANDO PROTOCOLOS DE SEGURANÇA...",
    "> ACESSO LIBERADO."
];

const linhas = [
    document.getElementById("linha2"),
    document.getElementById("linha3"),
    document.getElementById("linha4")
];

const botao = document.getElementById("entrar");

const carregamento = setInterval(() => {

    porcentagem += 2;

    document.getElementById("progresso").style.width =
        porcentagem + "%";

    if (porcentagem >= 34) {
        linhas[0].textContent = mensagens[0];
    }

    if (porcentagem >= 58) {
        linhas[1].textContent = mensagens[1];
    }

    if (porcentagem >= 100) {
        linhas[2].textContent = mensagens[2];

        clearInterval(carregamento);

        botao.disabled = false;
        botao.textContent = "ENTRAR NO SISTEMA";
    }

}, 45);


// ENTRAR NO SITE

function entrarSistema() {
    document.getElementById("entrada").style.display = "none";
    document.getElementById("principal").style.display = "flex";
}


// COPIAR USUÁRIO DO DISCORD

function copiarDiscord() {

    navigator.clipboard.writeText("Nesquiik1999")
    .then(() => {

        const botao = document.querySelector("#principal button");

        botao.textContent = "USUÁRIO COPIADO!";

        setTimeout(() => {
            botao.textContent = "COPIAR USUÁRIO";
        }, 2000);

    })
    .catch(() => {
        alert("Seu usuário é: Nesquiik1999");
    });
}

</script>

</body>
</html>
